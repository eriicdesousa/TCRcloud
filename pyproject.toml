[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "TCRcloud"
version = "2.0.0.dev0"
description = "TCRcloud is an AIRR visualization and comparison tool"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    { name = "Eric de Sousa", email = "eric.de.sousa@ki.se" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "airr >=1.5.0",
    "kaleido == 0.2.1",
    "matplotlib >=3.7.0",
    "natsort",
    "numpy",
    "pandas >=2.0",
    "plotly >=6.0.1",
    "pyyaml",
    "requests",
    "scikit-bio",
    "scikit-learn",
    "scipy >=1.3.0",
    "wordcloud",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# Maintainer-only tooling. `glasbey` is used solely by the standalone
# `tcrcloud.assign_colours` palette-regeneration script (not wired into the
# CLI); install with ``pip install -e ".[maintenance]"`` when regenerating
# the built-in V-gene colour dicts.
maintenance = [
    "glasbey",
]

[project.scripts]
TCRcloud = "tcrcloud.TCRcloud:main"

[project.urls]
"Bug Tracker" = "https://github.com/eriicdesousa/TCRcloud/issues"
Homepage = "https://github.com/eriicdesousa/TCRcloud"

# Linting. `ruff` is also run in CI (see .github/workflows/tests.yml).
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors, I: import sorting, UP: pyupgrade,
# B: bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Long error/help messages use implicit string concatenation.
    "E501",
    # The plotly-heavy modules build large scene/layout configs with dict(...)
    # calls; rewriting them all as literals would be pure churn.
    "C408",
    # flake8-simplify's if/else-collapsing and `in dict.keys()` suggestions
    # trade a little readability for no real gain in this codebase.
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
# Maintainer-only palette script: it imports a colour module *dynamically*
# (importlib) and reads its attributes with getattr, which is legitimate here
# and not safely replaceable by direct attribute access.
"src/tcrcloud/assign_colours.py" = ["B009"]
