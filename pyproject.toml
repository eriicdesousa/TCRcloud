[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "TCRcloud"
version = "2.0.0dev"
description = "TCRcloud is an AIRR visualization and comparison tool"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    { name = "Eric de Sousa", email = "eric.de.sousa@ki.se" },
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "airr >=1.5.0",
    "kaleido == 0.2.1",
    "matplotlib >=3.7.0",
    "natsort",
    "numpy >=1.9.2",
    "pandas",
    "plotly >=6.0.1",
    "pyyaml",
    "requests",
    "scikit-bio",
    "scikit-learn",
    "scipy >=1.3.0",
    "wordcloud",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "glasbey",
]

[project.scripts]
TCRcloud = "tcrcloud.TCRcloud:main"

[project.urls]
"Bug Tracker" = "https://github.com/eriicdesousa/TCRcloud/issues"
Homepage = "https://github.com/eriicdesousa/TCRcloud"
